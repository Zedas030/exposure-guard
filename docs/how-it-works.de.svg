<rect x="411.0" y="911" width="78" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="450" y="925.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">ZU HAUSE</text>
<circle cx="318.8" cy="1064" r="12" fill="#1e88e5"/>
<text x="318.8" y="1069" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">8</text>
<text x="338.8" y="1070" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Mit Baseline vergleichen</text>
<text x="450" y="1096" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Befunde werden mit dem bekannten</text>
<text x="450" y="1115" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Stand und den Quittierungen</text>
<text x="450" y="1134" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">abgeglichen. Nur echte Änderungen</text>
<text x="450" y="1153" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">zählen, mit Schweregrad.</text>
