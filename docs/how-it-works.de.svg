<circle cx="160" cy="980" r="47" fill="#eef6fe"/>
<text x="160" y="997" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">📦</text>
<rect x="141.0" y="911" width="38" height="20" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
<text x="160" y="925.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#e65100">VPS</text>
<circle cx="38.400000000000006" cy="1064" r="12" fill="#1e88e5"/>
<text x="38.400000000000006" y="1069" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">7</text>
<text x="58.400000000000006" y="1070" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Versiegeln &amp; signieren</text>
<text x="160" y="1096" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Ergebnisse sind für den Wächter</text>
<text x="160" y="1115" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">verschlüsselt und von der</text>
<text x="160" y="1134" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Prüfstation signiert. Auf dem VPS</text>
<text x="160" y="1153" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">nützen sie niemandem.</text>
<circle cx="450" cy="980" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="450" cy="980" r="47" fill="#eef6fe"/>
