<path d="M522,980 H664" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ah)"/>
<circle cx="160" cy="300" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="160" cy="300" r="47" fill="#eef6fe"/>
<text x="160" y="317" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">📡</text>
<rect x="121.0" y="231" width="78" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="160" y="245.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">ZU HAUSE</text>
<circle cx="72.0" cy="384" r="12" fill="#1e88e5"/>
<text x="72.0" y="389" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="92.0" y="390" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Router auslesen</text>
<text x="160" y="416" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">FRITZ!Box per TR-064 und UPnP-IGD,</text>
<text x="160" y="435" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">nur lesend: jede Portfreigabe,</text>
<text x="160" y="454" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">manuell oder UPnP, Fernzugang,</text>
<text x="160" y="473" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Firmware. Alle 10 Minuten.</text>
<circle cx="450" cy="300" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="450" cy="300" r="47" fill="#eef6fe"/>
<text x="450" y="317" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">💻</text>
<rect x="411.0" y="231" width="78" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="450" y="245.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">ZU HAUSE</text>
<circle cx="376.4" cy="384" r="12" fill="#1e88e5"/>
<text x="376.4" y="389" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="396.4" y="390" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">LAN erfassen</text>
<text x="450" y="416" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Geräteliste, ARP und NDP: neue</text>
<text x="450" y="435" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">unbekannte Geräte mit MAC,</text>
<text x="450" y="454" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Hersteller, Hostname. Wöchentlich</text>
<text x="450" y="473" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">ein schonender Web-/TLS-Check.</text>
<circle cx="740" cy="300" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="740" cy="300" r="47" fill="#eef6fe"/>
<text x="740" y="317" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">🕸️</text>
<rect x="701.0" y="231" width="78" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="740" y="245.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">ZU HAUSE</text>
<circle cx="647.2" cy="384" r="12" fill="#1e88e5"/>
<text x="647.2" y="389" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">3</text>
<text x="667.2" y="390" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Tailscale prüfen</text>
<text x="740" y="416" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Geräte, Key-Ablauf, Exit-Nodes,</text>
<text x="740" y="435" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Subnet-Routen und ACL-Regeln,</text>
<text x="740" y="454" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">alles über Nur-Lese-Schnittstellen.</text>
<circle cx="740" cy="640" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="740" cy="640" r="47" fill="#eef6fe"/>
<text x="740" y="657" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">✍️</text>
<rect x="701.0" y="571" width="78" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="740" y="585.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">ZU HAUSE</text>
<circle cx="652.0" cy="724" r="12" fill="#1e88e5"/>
<text x="652.0" y="729" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">4</text>
<text x="672.0" y="730" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Ziele signieren</text>
<text x="740" y="756" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Öffentliche IPv4 und jede globale</text>
<text x="740" y="775" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">IPv6-Adresse aus dem LAN kommen</text>
<text x="740" y="794" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">in eine vom Wächter signierte Liste.</text>
<circle cx="450" cy="640" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="450" cy="640" r="47" fill="#eef6fe"/>
<text x="450" y="657" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">🔑</text>
<rect x="431.0" y="571" width="38" height="20" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
<text x="450" y="585.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#6a1b9a">SSH</text>
<circle cx="352.4" cy="724" r="12" fill="#1e88e5"/>
<text x="352.4" y="729" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">5</text>
<text x="372.4" y="730" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Per SSH übergeben</text>
<text x="450" y="756" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Von zu Hause ausgehend, nur ein</text>
<text x="450" y="775" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">erzwungener Befehl. Zu Hause ist</text>
<text x="450" y="794" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">kein Port offen, die Prüfstation</text>
<text x="450" y="813" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">kommt nie ins LAN oder Tailnet.</text>
<circle cx="160" cy="640" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="160" cy="640" r="47" fill="#eef6fe"/>
<text x="160" y="657" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">🌍</text>
<rect x="141.0" y="571" width="38" height="20" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
<text x="160" y="585.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#e65100">VPS</text>
<circle cx="62.400000000000006" cy="724" r="12" fill="#1e88e5"/>
<text x="62.400000000000006" y="729" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">6</text>
<text x="82.4" y="730" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Von außen scannen</text>
<text x="160" y="756" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Die Prüfstation auf einem VPS</text>
<text x="160" y="775" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">scannt nur signierte Ziele: täglich</text>
<text x="160" y="794" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Top-Ports, wöchentlich alle TCP,</text>
<text x="160" y="813" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">neue Freigaben sofort.</text>
