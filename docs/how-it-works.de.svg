<text x="450.0" y="67" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#24292f">Exposure-Wächter</text>
<text x="450.0" y="142" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#1e88e5">So funktioniert's</text>
<text x="450.0" y="180" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">Vom Router bis zur Meldung: alle 10 Minuten zu Hause, täglich aus dem Internet</text>
