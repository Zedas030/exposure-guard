<circle cx="740" cy="980" r="47" fill="#eef6fe"/>
<text x="740" y="997" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">📣</text>
<rect x="701.0" y="911" width="78" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="740" y="925.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">ZU HAUSE</text>
<circle cx="637.6" cy="1064" r="12" fill="#1e88e5"/>
<text x="637.6" y="1069" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">9</text>
<text x="657.6" y="1070" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Melden &amp; berichten</text>
<text x="740" y="1096" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Kritisch: sofort Push über Home</text>
<text x="740" y="1115" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Assistant. Dazu Sensoren, Grafana,</text>
<text x="740" y="1134" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Weboberfläche :8103 und</text>
<text x="740" y="1153" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Wochenbericht mit Maßnahme.</text>
<line x1="120" y1="1188" x2="780" y2="1188" stroke="#d0d7de"/>
<text x="450.0" y="1220" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2e7d32">Schreibt nie an den Router  ·  Kein offener Port zu Hause  ·  Die Prüfstation kommt nie ins LAN</text>
