<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1250" viewBox="0 0 900 1250">
<title>Exposure Guard: How It Works</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e88e5"/></marker>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e88e5" flood-opacity="0.18"/></filter>
</defs>
<rect x="1" y="1" width="898" height="1248" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<line x1="450.0" y1="0" x2="450.0" y2="40" stroke="#1e88e5" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="330.0" y="40" width="240" height="40" fill="#fff" stroke="#24292f" stroke-width="1.5"/>
<text x="450.0" y="67" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#24292f">Exposure Guard</text>
<text x="450.0" y="142" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#1e88e5">How It Works</text>
<text x="450.0" y="180" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">From the router to the alert, every 10 minutes at home and daily from the internet</text>
<path d="M232,300 H374" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M522,300 H664" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M812,300 H860 V640 H816" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M668,640 H526" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M378,640 H236" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M88,640 H40 V980 H84" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M232,980 H374" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M522,980 H664" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ah)"/>
<circle cx="160" cy="300" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="160" cy="300" r="47" fill="#eef6fe"/>
<text x="160" y="317" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">📡</text>
<rect x="137.0" y="231" width="46" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="160" y="245.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">HOME</text>
<circle cx="72.0" cy="384" r="12" fill="#1e88e5"/>
<text x="72.0" y="389" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="92.0" y="390" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Read The Router</text>
<text x="160" y="416" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">FRITZ!Box via TR-064 and UPnP IGD,</text>
<text x="160" y="435" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">read-only: every port forwarding,</text>
<text x="160" y="454" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">manual vs. UPnP, remote access,</text>
<text x="160" y="473" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">firmware. Every 10 minutes.</text>
<circle cx="450" cy="300" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="450" cy="300" r="47" fill="#eef6fe"/>
<text x="450" y="317" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">💻</text>
<rect x="427.0" y="231" width="46" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="450" y="245.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">HOME</text>
<circle cx="381.2" cy="384" r="12" fill="#1e88e5"/>
<text x="381.2" y="389" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="401.2" y="390" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Map The LAN</text>
<text x="450" y="416" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Router host list, ARP and NDP:</text>
<text x="450" y="435" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">new unknown devices with MAC,</text>
<text x="450" y="454" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">vendor and hostname. Weekly a</text>
<text x="450" y="473" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">gentle web/TLS check.</text>
<circle cx="740" cy="300" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="740" cy="300" r="47" fill="#eef6fe"/>
<text x="740" y="317" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">🕸️</text>
<rect x="717.0" y="231" width="46" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="740" y="245.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">HOME</text>
<circle cx="652.0" cy="384" r="12" fill="#1e88e5"/>
<text x="652.0" y="389" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">3</text>
<text x="672.0" y="390" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Check Tailscale</text>
<text x="740" y="416" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Nodes, key expiry, exit nodes,</text>
<text x="740" y="435" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">subnet routes and the ACL policy,</text>
<text x="740" y="454" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">all through read-only APIs.</text>
<circle cx="740" cy="640" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="740" cy="640" r="47" fill="#eef6fe"/>
<text x="740" y="657" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">✍️</text>
<rect x="717.0" y="571" width="46" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="740" y="585.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">HOME</text>
<circle cx="647.2" cy="724" r="12" fill="#1e88e5"/>
<text x="647.2" y="729" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">4</text>
<text x="667.2" y="730" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Sign The Targets</text>
<text x="740" y="756" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Public IPv4 and every global IPv6</text>
<text x="740" y="775" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">address seen in the LAN go into a</text>
<text x="740" y="794" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">target list signed by the guard.</text>
<circle cx="450" cy="640" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="450" cy="640" r="47" fill="#eef6fe"/>
<text x="450" y="657" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">🔑</text>
<rect x="431.0" y="571" width="38" height="20" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
<text x="450" y="585.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#6a1b9a">SSH</text>
<circle cx="352.4" cy="724" r="12" fill="#1e88e5"/>
<text x="352.4" y="729" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">5</text>
<text x="372.4" y="730" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Hand Over Via SSH</text>
<text x="450" y="756" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Outbound from home, forced</text>
<text x="450" y="775" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">command only. No port is opened</text>
<text x="450" y="794" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">at home, the probe never gets</text>
<text x="450" y="813" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">into the LAN or the tailnet.</text>
<circle cx="160" cy="640" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="160" cy="640" r="47" fill="#eef6fe"/>
<text x="160" y="657" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">🌍</text>
<rect x="141.0" y="571" width="38" height="20" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
<text x="160" y="585.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#e65100">VPS</text>
<circle cx="62.400000000000006" cy="724" r="12" fill="#1e88e5"/>
<text x="62.400000000000006" y="729" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">6</text>
<text x="82.4" y="730" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Scan From Outside</text>
<text x="160" y="756" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">The probe on a small VPS runs nmap</text>
<text x="160" y="775" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">against signed targets only: top</text>
<text x="160" y="794" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">ports daily, all TCP weekly, a new</text>
<text x="160" y="813" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">forwarding is checked at once.</text>
<circle cx="160" cy="980" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="160" cy="980" r="47" fill="#eef6fe"/>
<text x="160" y="997" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">📦</text>
<rect x="141.0" y="911" width="38" height="20" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
<text x="160" y="925.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#e65100">VPS</text>
<circle cx="81.6" cy="1064" r="12" fill="#1e88e5"/>
<text x="81.6" y="1069" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">7</text>
<text x="101.6" y="1070" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Seal And Sign</text>
<text x="160" y="1096" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Results are encrypted to the</text>
<text x="160" y="1115" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">guard's key and signed by the</text>
<text x="160" y="1134" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">probe. On the VPS they are</text>
<text x="160" y="1153" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">useless to anyone else.</text>
<circle cx="450" cy="980" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="450" cy="980" r="47" fill="#eef6fe"/>
<text x="450" y="997" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">⚖️</text>
<rect x="427.0" y="911" width="46" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="450" y="925.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">HOME</text>
<circle cx="342.8" cy="1064" r="12" fill="#1e88e5"/>
<text x="342.8" y="1069" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">8</text>
<text x="362.8" y="1070" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Compare To Baseline</text>
<text x="450" y="1096" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Findings are matched against the</text>
<text x="450" y="1115" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">baseline and your acks. Only real</text>
<text x="450" y="1134" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">changes count, each with a</text>
<text x="450" y="1153" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">severity from info to critical.</text>
<circle cx="740" cy="980" r="56" fill="#fff" stroke="#1e88e5" stroke-width="3" filter="url(#sh)"/>
<circle cx="740" cy="980" r="47" fill="#eef6fe"/>
<text x="740" y="997" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="46">📣</text>
<rect x="717.0" y="911" width="46" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="740" y="925.5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d32">HOME</text>
<circle cx="647.2" cy="1064" r="12" fill="#1e88e5"/>
<text x="647.2" y="1069" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">9</text>
<text x="667.2" y="1070" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24292f">Alert And Report</text>
<text x="740" y="1096" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Critical: instant push via Home</text>
<text x="740" y="1115" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">Assistant. Plus sensors, Grafana,</text>
<text x="740" y="1134" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">web UI :8103 and a weekly report</text>
<text x="740" y="1153" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#424a53">with a concrete action each.</text>
<line x1="120" y1="1188" x2="780" y2="1188" stroke="#d0d7de"/>
<text x="450.0" y="1220" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2e7d32">Never writes to the router  ·  No inbound port at home  ·  The probe never enters the LAN</text>
</svg>
